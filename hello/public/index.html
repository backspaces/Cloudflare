<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Hello Worker</title>
    </head>
    <body>
        <h1>Hello Worker</h1>
        <p>This page is a static asset: served from public/, no Worker code ran.</p>
        <p>These buttons call the Worker's code in worker.ts:</p>

        <button onclick="show('/hello')">/hello (env vars)</button>
        <button onclick="show('/count')">/count (Durable Object)</button>
        <button onclick="show('/note')">/note (KV read)</button>
        <input id="note" placeholder="a note to save" />
        <button onclick="show('/note', document.getElementById('note').value)">
            save note (KV write)
        </button>

        <pre id="out"></pre>

        <script>
            async function show(path, body) {
                const options = body === undefined ? {} : { method: 'POST', body }
                const response = await fetch(path, options)
                document.getElementById('out').textContent =
                    path + ' → ' + JSON.stringify(await response.json(), null, 2)
            }
        </script>
    </body>
</html>
